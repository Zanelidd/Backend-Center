services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pokecollection
    ports:
      - "5432:5432"
    volumes:
      # On monte sur /var/lib/postgresql au lieu de /data
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: